name: Haku server package
on:
  push:
    branches: [haku]
    tags: ['haku-v*']
  pull_request:
    branches: [haku]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rootless:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test package and configuration
        run: python3 -m unittest discover -s haku/tests -v
      - name: Install signing tool
        run: brew install ldid
      - name: Build from source
        run: python3 haku/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: haku-server-rootless
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/haku-v')
    needs: rootless
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: haku-server-rootless
          path: dist
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HAKU_TAG: ${{ github.ref_name }}
        run: gh release create "$HAKU_TAG" dist/* --title "haku-server $HAKU_TAG" --prerelease --generate-notes
